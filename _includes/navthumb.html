{%- assign auto = site.data.translations | find: "eng", include.eng -%}
{%- if auto.eng[0] != "" and auto.eng[0] != nil -%}{%- assign name = auto.eng[0] -%}{%- else -%}{%- assign name = include.eng -%}{%- endif -%}<figure>
	{%- if include.link -%}
		<a href="{%- link {{- include.link | append: ".html" -}} -%}"><img src="/assets/images/thumbs/{{- include.thumb -}}" alt="{{- name -}}" /></a>
	{%- else -%}
		<img src="/assets/images/thumbs/{{- include.thumb -}}" alt="{{- name -}}" />
	{%- endif -%}
	<figcaption{%- if include.style %} style="{{- include.style -}}"{%- endif -%}>
		{%- if auto.jpn[0] == auto.eng[0] and auto.furi != nil and auto.furi != "" -%}
			{%- assign incljpn = auto.jpn[0] -%}{%- assign inclfuri = auto.furi[0] -%}{%- assign inclrom = auto.rom[0] -%}
			<em>{%- include jpn.html jpn=incljpn furi=inclfuri rom=inclrom class="title" -%}</em>{%- elsif auto.jpn[0] == auto.eng[0] and auto.jpn != nil and auto.jpn != "" and auto.eng != nil and auto.eng != "" -%}
			{%- if include.format == "quote" -%}<span class="title">&quot;{{- name -}}&quot;</span>{%- elsif include.format == "none" -%}<span class="title">{{- name -}}{%- else -%}</span><em class="title">{{- name -}}</em>{%- endif -%}{%- elsif auto.jpn[0] != nil and auto.jpn[0] != "" and auto.rom[0] != nil and auto.rom[0] != "" -%}
			{%- include jpnauto.html eng=name class="title" -%}<br />{%- if include.format == "quote" -%}&quot;{{- name -}}&quot;{%- elsif include.format == "none" -%}{{- name -}}{%- else -%}<em>{{- name -}}</em>{%- endif -%}{%- elsif include.furi and include.jpn == name -%}
			<em>{%- include jpn.html jpn=include.jpn furi=include.furi rom=include.rom class="title" -%}</em>{%- elsif include.jpn -%}
			{%- include jpn.html jpn=include.jpn furi=include.furi rom=include.rom class="title" -%}<br />{%- if include.format == "quote" -%}&quot;{{- name -}}&quot;{%- elsif include.format == "none" -%}{{- name -}}{%- else -%}<em>{{- name -}}</em>{%- endif -%}{%- elsif include.eng -%}
			{%- if include.format == "quote" -%}<span class="title">&quot;{{- name -}}&quot;</span>{%- elsif include.format == "none" -%}<span class="title">{{- name -}}</span>{%- else -%}<em class="title">{{- name -}}</em>{%- endif -%}
		{%- endif -%}
		{%- if include.date -%}<br /><span class="date">{{- include.date -}}</span>{%- if include.caption -%}<br />{%- endif -%}{%- endif -%}
		{%- if include.caption -%}{{- include.caption -}}{%- endif -%}
</figcaption></figure>
